name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Java 11 until the Quarkus upgrade; Lombok 1.18.10 does not run on newer JDKs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build and unit test
        run: ./mvnw -B package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Node 12 until the Angular upgrade; Angular 8 does not build on newer Node versions
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build -- --prod
