items:
  - title: GitHub
    subtitle: The code
    icon: fab fa-github
    description: >
      All the code, including this website, is available on GitHub.
      Feel free to fork the repo to use it in your own projects, log
      any issues you might find or propose a new fix or feature with
      a pull request.
    call_to_action_name: Find the code
    call_to_action_link: https://github.com/martijnburger/teamplanner/
  - title: Martijn Burger
    subtitle: Lead programmer
    icon: fab fa-linkedin
    description: >
      Martijn is the lead developer of this application. If you want
      to ask him something, open an issue on GitHub or contact him via
      a LinkedIn message.
    call_to_action_name: LinkedIn profile
    call_to_action_link: https://www.linkedin.com/in/brgrm/
  - title: Roeiploeg Utrecht
    subtitle: Dutch rowing
    icon: fa-anchor
    description: >
      The primary target for this application is the Dutch sloop
      rowing club 'Roeiploeg Utrecht' from the beautiful city of
      Utrecht. The lead dev of this application is a member at
      this club. 
    call_to_action_name: Visit the website
    call_to_action_link: https://www.roeiploegutrecht.nl
