title: Teamplanner
tagline: Get on board
email: martijn@roeiploegutrecht.nl
description: >-
  Teamplanner is an open source project in progress. Its goal is to
  provide a web application that holds the planning for sports teams.
theme: bulma-clean-theme
url: https://martijnburger.github.io
baseurl: /teamplanner

paginate: 5
paginate_path: "/blog/page:num/"
disqus:
  shortname: martijn

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

show_excerpts: true
sass:
  style: compressed
  source_dir: _sass
markdown: kramdown
highlighter: rouge
footer_menu: footer

defaults:
  - scope:
      path: ""
    values:
      hero_image: "/teamplanner/assets/img/hero.jpeg"
      title: "Get on board"
      subtitle: "with Teamplanner!"
      show_sidebar: true
  - scope:
      path: ""
      type: "posts"
    values:
      author: "Martijn Burger"  
